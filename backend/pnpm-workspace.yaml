allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true

# Force a patched multer (transitive via @nestjs/platform-express). We don't
# use file uploads, but the DoS advisories (GHSA-72gw-mp4g-v24j /
# GHSA-3p4h-7m6x-2hcm) are fixed in >=2.2.0. Keeps `pnpm audit` clean.
overrides:
  multer: '>=2.2.0'
