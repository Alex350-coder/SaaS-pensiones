# SPA host + same-origin reverse proxy (Phase 18). Serves the built bundle and
# forwards /api and /socket.io to the `api` service, so the browser sees one
# origin — no CORS, and the httpOnly auth cookies just work.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (docs/security.md §5) ---------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Strict CSP for the SPA. Vite emits hashed external JS with no inline
    # scripts, so script-src 'self' (no 'unsafe-inline') is equivalent-strength
    # to a nonce for a static bundle. Styles need 'unsafe-inline' because Radix
    # / sonner set inline style attributes; that carries no script-execution
    # risk. img-src allows https: for the demo restaurant cover images.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # --- API reverse proxy -----------------------------------------------
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket (Socket.IO) reverse proxy -----------------------------
    location /socket.io/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA client-side routing fallback --------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
